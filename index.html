<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./Assents/img/calculator_7448648.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Contenedor_calculadora">
        <div class="Pantalla">0</div>
        <div class="contenedor_teclado">
            <div class="teclado">
                <div class="btn">7</div>
                <div class="btn">8</div>
                <div class="btn">9</div>
                <div id="masMenos" class="btn">+/-</div>
                <div id="restar" class="btn">←</div>
                <div class="btn">4</div>
                <div class="btn">5</div>
                <div class="btn">6</div>
                <div class="btn">*</div>
                <div class="btn">/</div>
                <div class="btn">1</div>
                <div class="btn">2</div>
                <div class="btn">3</div>
                <div class="btn">-</div>
                <div id="igual" class="btn">=</div>
                <div id="c" class="btn">C</div>
                <div class="btn">0</div>
                <div class="btn">.</div>
                <div class="btn">+</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
